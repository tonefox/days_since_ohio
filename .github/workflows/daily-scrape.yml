name: Daily Incident Scraper

on:
  schedule:
    # Runs at 8:00 AM ET every day (13:00 UTC)
    - cron: '0 13 * * *'
  # Also allows manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        env:
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scripts/scraper.py

      - name: Regenerate RSS feed
        run: python scripts/generate_feed.py

      - name: Check for new candidates
        id: check
        run: |
          if git diff --quiet scripts/candidates.json scripts/.seen_urls.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            COUNT=$(python -c "import json; data=json.load(open('scripts/candidates.json')); print(len(data))")
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request with candidates
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: scraper found ${{ steps.check.outputs.count }} candidate(s) — $(date +'%Y-%m-%d')"
          branch: scraper/candidates-${{ github.run_id }}
          delete-branch: true
          title: "🚗💥 ${{ steps.check.outputs.count }} new candidate incident(s) — $(date +'%Y-%m-%d')"
          body: |
            The daily scraper found **${{ steps.check.outputs.count }}** candidate incident(s) from Google News, Reddit, and Columbus PD/Fire sources.

            ## Review Instructions

            1. Open `scripts/candidates.json` in this PR
            2. For each candidate, verify it's a real Ohio car-into-building incident with a working source link
            3. For approved incidents:
               - Fill in: `location`, `city`, `county`, `building_type`, `status`, `injuries`, `funny_note`
               - Move the object to `incidents.json` (add a sequential `id`)
            4. Delete false positives from `candidates.json`
            5. Merge this PR — Netlify will auto-deploy

            ---
            *No personal information about drivers should be included. Source link required for all entries.*
          labels: |
            scraper
            needs-review
